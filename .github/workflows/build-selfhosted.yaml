on: [push]

env:
  RELEASE_START: 1700
  TARGET_ARCH: arm64
  CROSS_COMPILE_PREFIX: aarch64-linux-gnu-

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Install build dependencies and github-release
      run: |
        sudo apt-get -y update
        sudo apt-get -y install \
          build-essential \
          crossbuild-essential-arm64 \
          ccache \
          rsync \
          bc \
          libssl-dev \
          bison \
          flex \
          libelf-dev \
          kmod \
          curl \
          jq \
          rsync \
          git \
          wget \
          xz-utils \
          dwarves
            
    - name: setup deb822 repos
      run: |
           cat <<EOF > deb822sources
           Types: deb
           URIs: http://archive.ubuntu.com/ubuntu/
           Suites: noble
           Components: main restricted universe
           Architectures: amd64
          
           Types: deb
           URIs: http://security.ubuntu.com/ubuntu/
           Suites: noble-security
           Components: main restricted universe
           Architectures: amd64
          
           Types: deb
           URIs: http://archive.ubuntu.com/ubuntu/
           Suites: noble-updates
           Components: main restricted universe
           Architectures: amd64
          
           Types: deb
           URIs: http://azure.ports.ubuntu.com/ubuntu-ports/
           Suites: noble
           Components: main restricted multiverse universe
           Architectures: arm64
          
           Types: deb
           URIs: http://azure.ports.ubuntu.com/ubuntu-ports/
           Suites: noble-updates
           Components: main restricted multiverse universe
           Architectures: arm64
           EOF
           sudo mv deb822sources /etc/apt/sources.list.d/ubuntu.sources
    - name: add arm64
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt update
        sudo apt-get -y --ignore-missing install \
          libssl-dev:arm64 \
          libelf-dev:arm64
        echo "Installing github-release..."
        GH_RELEASE_LATEST_URL=$(curl -sL https://api.github.com/repos/github-release/github-release/releases/latest | jq -r '.assets[] | select(.name | test("linux-amd64-github-release.bz2$")) | .browser_download_url')
        if [ -z "$GH_RELEASE_LATEST_URL" ]; then
          echo "Failed to get github-release download URL"
          exit 1
        fi
        curl -sL "$GH_RELEASE_LATEST_URL" | bzcat > github-release
        chmod +x github-release
        sudo mv github-release /usr/local/bin/
    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> $GITHUB_ENV
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        ccache -M 20G
        ccache -o compression=true
    - name: Reset ccache statistics
      run: ccache -z

    # MOVED THIS STEP UP: Patch dev.mk *before* it's used by 'Prepare Release Information'
