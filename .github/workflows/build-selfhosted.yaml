    - name: Prepare Release Information
      id: prep_release
      run: |
        RELEASE_NUMBER=$((${{ env.RELEASE_START }} + $GITHUB_RUN_NUMBER))
        echo "RELEASE_NUMBER=${RELEASE_NUMBER}" >> $GITHUB_OUTPUT
        if [ -f "./dev-make-cross" ] && [ ! -x "./dev-make-cross" ]; then chmod +x ./dev-make-cross; fi
        # dev.mk should now be patched if it existed.
        # Capture RELEASE_TAG_NAME
        # The 'version' target in dev.mk is: @echo "$(KDEB_PKGVERSION)"
        # KERNEL_VERSION = $(shell $(KERNEL_MAKE) -s kernelversion)
        # 'make -s kernelversion' is usually clean.
        _tag_name_full_output=$(./dev-make-cross version)
        # Get the last non-empty line
        _tag_name_value=$(echo "${_tag_name_full_output}" | sed '/^\s*$/d' | tail -n 1)
        echo "RELEASE_TAG_NAME=${_tag_name_value}" >> $GITHUB_OUTPUT
        # Capture DEB_INFO_PATTERN
        # The 'info' target in dev.mk is: @echo $(KERNEL_RELEASE)
        # KERNEL_RELEASE = $(shell $(KERNEL_MAKE) -s kernelrelease)
        # This is the one that produced multi-line output.
        _deb_info_full_output=$(./dev-make-cross info)
        # Get the last non-empty line
        _deb_info_value=$(echo "${_deb_info_full_output}" | sed '/^\s*$/d' | tail -n 1)
        echo "DEB_INFO_PATTERN=${_deb_info_value}" >> $GITHUB_OUTPUT
        echo "--- Debug: Release Information ---"
        echo "Calculated RELEASE_NUMBER: ${RELEASE_NUMBER}"
        echo "Original output from './dev-make-cross version':"
        echo "${_tag_name_full_output}"
        echo "Processed RELEASE_TAG_NAME (last non-empty line): ${_tag_name_value}"
        echo "Original output from './dev-make-cross info':"
        echo "${_deb_info_full_output}"
        echo "Processed DEB_INFO_PATTERN (last non-empty line): ${_deb_info_value}"
        echo "--- End Debug: Release Information ---"
        # Verify that the values are not empty
        if [ -z "${_tag_name_value}" ]; then
          echo "::error::RELEASE_TAG_NAME is empty after processing. Full output was: ${_tag_name_full_output}"
          exit 1
        fi
        if [ -z "${_deb_info_value}" ]; then
          echo "::error::DEB_INFO_PATTERN is empty after processing. Full output was: ${_deb_info_full_output}"
          exit 1
        fi
    - name: Check AArch64 linker and QEMU_LD_PREFIX (for debugging)
      env:
        QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      run: |
        echo "--- Debug Information ---"
        echo "QEMU_LD_PREFIX is set to: $QEMU_LD_PREFIX"
        if [ -f "$QEMU_LD_PREFIX/lib/ld-linux-aarch64.so.1" ]; then
          echo "Found linker: $QEMU_LD_PREFIX/lib/ld-linux-aarch64.so.1"
        else
          echo "Linker NOT FOUND at $QEMU_LD_PREFIX/lib/ld-linux-aarch64.so.1"
        fi
        echo "--- End Debug Information ---"
    - name: Build package (cross-compiling for aarch64)
      env:
        ARCH: ${{ env.TARGET_ARCH }}
        CROSS_COMPILE: ${{ env.CROSS_COMPILE_PREFIX }}
        RELEASE: ${{ steps.prep_release.outputs.RELEASE_NUMBER }}
        QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      run: |
        sudo apt install -y build-essential:native debhelper-compat libssl-dev
        echo "Starting build with ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE RELEASE=$RELEASE QEMU_LD_PREFIX=$QEMU_LD_PREFIX"

    - name: Display ccache statistics
      run: ccache -s
      
    - name: Build package
      env:
        ARCH: ${{ env.TARGET_ARCH }}
        CROSS_COMPILE: ${{ env.CROSS_COMPILE_PREFIX }}
        QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE: ${{ steps.prep_release.outputs.RELEASE_TAG_NAME }}
      run: |
        sudo apt install debhelper -y
        git config --global --add safe.directory "/__w/linux-mainline-kernel/linux-mainline-kernel"
        git config --global --add safe.directory "/__w/linux-rockchip/linux-rockchip"
        git config --global user.name "gustkch0"
        git config --global user.email "gustavokch@gmail.com"
        export RELEASE=$(($RELEASE_START+$GITHUB_RUN_NUMBER))
        export RELEASE_1=$(($RELEASE_START+$GITHUB_RUN_NUMBER+1))
        ./dev-make-cross kernel-image-and-modules
        ./dev-make-cross kernel-package
        export RELEASE_NAME="$(./dev-make-cross version)"
        export RELEASE_TITLE="$(./dev-make-cross version)"
        sudo mkdir -p ./boot/dtbs
        sudo mkdir -p ./lib/modules
        sudo rsync --partial --checksum -rv arch/arm64/boot/Image ./boot/vmlinuz-$(KERNEL_RELEASE)
        sudo rsync --partial --checksum --include="*.dtb" -rv arch/arm64/boot/dts/rockchip ./boot/dtbs/$(KERNEL_RELEASE)
        sudo rsync --partial --checksum -av out/linux_modules/lib/modules/$(KERNEL_RELEASE) ./lib/modules
        tar -czvf boot.tar.gz ./boot
        tar -czvf modules.tar.gz ./lib/modules
        tar -czvf release.tar.gz boot.tar.gz modules.tar.gz
        export DESCRIPTION="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        sudo find ../ -type f -name "*.deb" > deb
        export DEB=$(cat deb)
        export TAR=$(cat tar)
        sudo find ../ -type f -name "release.tar.gz" > tar
        echo $RELEASE
        echo $RELEASE_TITLE
        echo $RELEASE_NAME
        gh release create --title $RELEASE_TITLE --generate-notes -R https://github.com/gustkch0/linux-mainline-kernel $RELEASE $DEB
        gh release create --title $RELEASE_TITLE --generate-notes -R https://github.com/gustkch0/linux-mainline-kernel $RELEASE $TAR
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: .deb files
        path: ./*.deb
    - name: Release package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG_NAME: ${{ steps.prep_release.outputs.RELEASE_TAG_NAME }}
        DEB_INFO_PATTERN: ${{ steps.prep_release.outputs.DEB_INFO_PATTERN }}
      run: |
        set -x 
        RELEASE_TITLE="${RELEASE_TAG_NAME}"
        DESCRIPTION_TEXT="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        echo "Creating draft release: ${RELEASE_TAG_NAME}"
        github-release release \
          --tag "${RELEASE_TAG_NAME}" \
          --name "${RELEASE_TITLE}" \
          --description "${DESCRIPTION_TEXT}" \
          --target "${GITHUB_SHA}" \
          --draft
        echo "Sleeping for 3s to allow release to be created..."
        sleep 3s
        DEB_FILES_PATH="../" 
        DEB_PATTERN="*${DEB_INFO_PATTERN}*.deb"
        
        echo "Looking for deb files in ${DEB_FILES_PATH} matching ${DEB_PATTERN}"
        shopt -s nullglob
        DEB_FILES=(${DEB_FILES_PATH}${DEB_PATTERN})
        shopt -u nullglob
        if [ ${#DEB_FILES[@]} -eq 0 ]; then
          echo "Warning: No .deb files found matching pattern '${DEB_FILES_PATH}${DEB_PATTERN}'"
        else
          echo "Found .deb files:"
          printf " - %s\n" "${DEB_FILES[@]}"
          for i in "${DEB_FILES[@]}"; do
            echo "Uploading $(basename "${i}")..."
            github-release upload \
              --tag "${RELEASE_TAG_NAME}" \
              --name "$(basename "${i}")" \
              --file "${i}"
          done
        fi
        echo "Finalizing release (removing draft status)..."
        github-release edit \
          --tag "${RELEASE_TAG_NAME}" \
          --name "${RELEASE_TITLE}" \
          --description "${DESCRIPTION_TEXT}"
        if [ ${#DEB_FILES[@]} -gt 0 ]; then
          echo "Removing uploaded .deb files from build workspace..."
          rm -f "${DEB_FILES[@]}"
        fi
