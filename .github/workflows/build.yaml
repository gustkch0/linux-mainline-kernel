on: [push]

env:
  RELEASE_START: 1600 # 1150, as this is latest build by GitLab CI
  TARGET_ARCH: arm64
  CROSS_COMPILE_PREFIX: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Install build dependencies and github-release
      run: |
        sudo apt-get -y update
        sudo apt-get -y install \
          crossbuild-essential-arm64 \
          ccache \
          bc \
          libssl-dev \
          bison \
          flex \
          libelf-dev \
          kmod \
          curl \
          jq \
          rsync \
          git \
          wget \
          xz-utils \
          dwarves # pahole is part of dwarves on modern Ubuntu

        echo "Installing github-release..."
        GH_RELEASE_LATEST_URL=$(curl -sL https://api.github.com/repos/github-release/github-release/releases/latest | jq -r '.assets[] | select(.name | test("linux-amd64-github-release.bz2$")) | .browser_download_url')
        if [ -z "$GH_RELEASE_LATEST_URL" ]; then
          echo "Failed to get github-release download URL"
          exit 1
        fi
        curl -sL "$GH_RELEASE_LATEST_URL" | bzcat > github-release
        chmod +x github-release
        sudo mv github-release /usr/local/bin/
        echo "github-release installed: $(github-release -V)"

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> $GITHUB_ENV
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV # Ensure ccache is in PATH
        ccache -M 10G
        ccache -o compression=true

    - name: Reset ccache statistics
      run: ccache -z

    - name: Prepare Release Information
      id: prep_release
      run: |
        RELEASE_NUMBER=$((${{ env.RELEASE_START }} + $GITHUB_RUN_NUMBER))
        echo "RELEASE_NUMBER=${RELEASE_NUMBER}" >> $GITHUB_OUTPUT

        if [ -f "./dev-make" ] && [ ! -x "./dev-make" ]; then chmod +x ./dev-make; fi

        RELEASE_TAG_NAME=$(./dev-make version)
        echo "RELEASE_TAG_NAME=${RELEASE_TAG_NAME}" >> $GITHUB_OUTPUT

        DEB_INFO_PATTERN=$(./dev-make info)
        echo "DEB_INFO_PATTERN=${DEB_INFO_PATTERN}" >> $GITHUB_OUTPUT

        echo "Calculated RELEASE_NUMBER: ${RELEASE_NUMBER}"
        echo "Calculated RELEASE_TAG_NAME: ${RELEASE_TAG_NAME}"
        echo "Calculated DEB_INFO_PATTERN: ${DEB_INFO_PATTERN}"

    - name: Build package (cross-compiling for aarch64)
      env:
        ARCH: ${{ env.TARGET_ARCH }}
        CROSS_COMPILE: ${{ env.CROSS_COMPILE_PREFIX }}
        RELEASE: ${{ steps.prep_release.outputs.RELEASE_NUMBER }}
        # Add QEMU_LD_PREFIX here
        QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      run: |
        echo "Starting build with ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE RELEASE=$RELEASE QEMU_LD_PREFIX=$QEMU_LD_PREFIX"
        # The ./dev-make script must be capable of handling these cross-compilation env vars
        # The kernel build system will try to run some host tools.
        # If these host tools (like fixdep) are compiled for arm64 (due to ARCH/CROSS_COMPILE),
        # QEMU will be invoked to run them. QEMU_LD_PREFIX tells QEMU where to find arm64 libs.
        ./dev-make kernel-package

    - name: Display ccache statistics
      run: ccache -s

    - name: Release package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG_NAME: ${{ steps.prep_release.outputs.RELEASE_TAG_NAME }}
        DEB_INFO_PATTERN: ${{ steps.prep_release.outputs.DEB_INFO_PATTERN }}
      run: |
        set -x 

        RELEASE_TITLE="${RELEASE_TAG_NAME}"
        DESCRIPTION_TEXT="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        echo "Creating draft release: ${RELEASE_TAG_NAME}"
        github-release release \
          --tag "${RELEASE_TAG_NAME}" \
          --name "${RELEASE_TITLE}" \
          --description "${DESCRIPTION_TEXT}" \
          --target "${GITHUB_SHA}" \
          --draft

        echo "Sleeping for 3s to allow release to be created..."
        sleep 3s

        DEB_FILES_PATH="../" 
        DEB_PATTERN="*${DEB_INFO_PATTERN}*.deb"
        
        echo "Looking for deb files in ${DEB_FILES_PATH} matching ${DEB_PATTERN}"
        shopt -s nullglob
        DEB_FILES=(${DEB_FILES_PATH}${DEB_PATTERN})
        shopt -u nullglob

        if [ ${#DEB_FILES[@]} -eq 0 ]; then
          echo "Warning: No .deb files found matching pattern '${DEB_FILES_PATH}${DEB_PATTERN}'"
        else
          echo "Found .deb files:"
          printf " - %s\n" "${DEB_FILES[@]}"
          for i in "${DEB_FILES[@]}"; do
            echo "Uploading $(basename "${i}")..."
            github-release upload \
              --tag "${RELEASE_TAG_NAME}" \
              --name "$(basename "${i}")" \
              --file "${i}"
          done
        fi

        echo "Finalizing release (removing draft status)..."
        github-release edit \
          --tag "${RELEASE_TAG_NAME}" \
          --name "${RELEASE_TITLE}" \
          --description "${DESCRIPTION_TEXT}"

        if [ ${#DEB_FILES[@]} -gt 0 ]; then
          echo "Removing uploaded .deb files from build workspace..."
          rm -f "${DEB_FILES[@]}"
        fi
